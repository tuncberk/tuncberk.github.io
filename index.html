<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berk Tunc — Hidden Place!</title>
  <meta name="description" content="Hidden Place! — a cozy 3D room puzzle for iPhone and iPad by Berk Tunc.">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <style>
    :root { --navy:#122047; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Lato, Helvetica, Arial, sans-serif;
      background:var(--navy); color:#fff;
      display:flex; flex-direction:column; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    main {
      flex:1 0 auto;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 20px; text-align:center; gap:22px;
    }
    .logo { width:100%; max-width:520px; height:auto; display:block; }
    .tagline { max-width:520px; font-size:1.1rem; line-height:1.55; color:rgba(255,255,255,.85); }
    .store {
      display:inline-flex; align-items:center; gap:10px;
      background:#fff; color:var(--navy);
      border:1.5px solid #fff; border-radius:8px;
      padding:12px 26px; font-size:1.05rem; font-weight:600; text-decoration:none;
      transition:background .15s ease, color .15s ease;
    }
    .store:hover { background:transparent; color:#fff; }
    .store svg { width:22px; height:22px; fill:currentColor; }
    footer {
      flex-shrink:0;
      display:flex; flex-direction:column; align-items:center; gap:18px;
      padding:0 20px 40px; text-align:center;
    }
    .btn {
      display:inline-block; background:transparent; color:#fff;
      border:1.5px solid rgba(255,255,255,.85);
      font-size:1rem; text-decoration:none;
      padding:10px 24px; border-radius:6px;
      transition:background .15s ease, color .15s ease;
    }
    .btn:hover { background:#fff; color:var(--navy); }
    .pp { color:#fff; text-decoration:none; font-size:.95rem; }
    .pp:hover { text-decoration:underline; }
    .copy { color:rgba(255,255,255,.7); font-size:.82rem; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/images/logo.png" alt="Hidden Place!">
    <p class="tagline">A cozy 3D room puzzle. Find where every piece belongs and bring each room back to life.</p>
    <a class="store" href="https://apps.apple.com/app/id6823591986" target="_blank" rel="noopener" aria-label="Hidden Place! on the App Store">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.53c-.02-2.4 1.96-3.56 2.05-3.62-1.12-1.64-2.86-1.86-3.48-1.89-1.48-.15-2.89.87-3.64.87-.75 0-1.91-.85-3.14-.83-1.61.02-3.1.94-3.93 2.38-1.68 2.91-.43 7.22 1.21 9.58.8 1.16 1.75 2.46 3 2.41 1.2-.05 1.66-.78 3.11-.78s1.86.78 3.14.76c1.3-.02 2.12-1.18 2.91-2.34.92-1.34 1.29-2.64 1.31-2.71-.03-.01-2.52-.97-2.54-3.83zM14 5.46c.66-.8 1.11-1.92.99-3.03-.95.04-2.11.63-2.79 1.43-.61.71-1.15 1.84-1.01 2.93 1.06.08 2.15-.54 2.81-1.33z"/></svg>
      Download on the App Store
    </a>
  </main>
  <footer>
    <a class="btn" href="mailto:berktnc@gmail.com">Contact Us</a>
    <a class="pp" href="/privacy-policy">Privacy Policy</a>
    <div class="copy">All rights reserved. © 2026 - Berk Tunc</div>
  </footer>
</body>
</html>
